<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Feichovy's personal GitHub Pages website">
    <title>Feichovy</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #f5f7fb;
        --surface: rgba(255, 255, 255, 0.82);
        --text: #172033;
        --muted: #64748b;
        --accent: #635bff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 20%, rgba(99, 91, 255, 0.18), transparent 28rem),
          radial-gradient(circle at 85% 80%, rgba(56, 189, 248, 0.16), transparent 24rem),
          var(--background);
        color: var(--text);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(680px, 100%);
        padding: clamp(32px, 8vw, 64px);
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 24px;
        background: var(--surface);
        box-shadow: 0 24px 60px rgba(30, 41, 59, 0.12);
        backdrop-filter: blur(12px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.75rem, 12vw, 5.25rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      p {
        max-width: 48rem;
        margin: 0;
        color: var(--muted);
        font-size: clamp(1.05rem, 3vw, 1.25rem);
        line-height: 1.7;
      }

      a {
        display: inline-block;
        margin-top: 28px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(99, 91, 255, 0.28);
      }

      a:focus-visible {
        outline: 3px solid rgba(99, 91, 255, 0.38);
        outline-offset: 4px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0f172a;
          --surface: rgba(30, 41, 59, 0.78);
          --text: #f8fafc;
          --muted: #aab4c3;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Feichovy</h1>
      <p>Welcome to my personal page on GitHub Pages.</p>
      <a href="https://github.com/feichovy">View my GitHub profile</a>
    </main>
  </body>
</html>
